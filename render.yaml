services:
  - type: web
    name: aethera
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node Backend/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
